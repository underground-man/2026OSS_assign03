<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정 화면</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="my.css">
</head>
<body>
    <div class="container mt-4">
        <h3 class="mb-4">도서 수정</h3>
        <div class="card"><div class="card-body">
        <form id="editForm" novalidate>
            <div class="mb-3">
                <label for="title" class="form-label">도서명(필수)</label>
                <input type="text" class="form-control" id="title" value="이산수학" required>
            </div>

            <div class="mb-3">
                <label for="writer" class="form-label">저자</label>
                <input type="text" class="form-control" id="writer" value="김이산">
            </div>

            <div class="mb-3">
                <label for="publisher" class="form-label">출판사</label>
                <input type="text" class="form-control" id="publisher" value="미래">
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">출판년도</label>
                <input type="number" class="form-control" id="date" value="2020">
            </div>

            <div class="mb-3">
                <label for="ISBN" class="form-label">ISBN(필수)</label>
                <input type="text" class="form-control" id="ISBN" value="9781234567890" required>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">카테고리</label>
                <select class="form-select" id="category">
                    <option value="">선택하세요</option>
                    <option selected>IT</option>
                    <option>문학</option>
                    <option>비문학</option>
                    <option>sf</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">수정</button>
            <a href="view.html" class="btn btn-secondary">취소</a>
        </form>
        </div></div>
    </div>

<footer>© 도서 관리 시스템</footer>

<script>
    // 폼 제출 시 입력값 검사
    document.getElementById('editForm').addEventListener('submit', function (e) {
        e.preventDefault(); // 페이지 새로고침 방지

        // 입력값 가져오기
        const title = document.getElementById('title').value.trim();
        const writer = document.getElementById('writer').value.trim();
        const isbn = document.getElementById('ISBN').value.trim();
        const year = document.getElementById('date').value.trim();
        const category = document.getElementById('category').value;

        // 검사 1: 필수값 (도서명)
        if (title === '') {
            alert('도서명을 입력해주세요.');
            return;
        }

        // 검사 2: 문자열 길이 (저자는 2자 이상)
        if (writer.length < 2) {
            alert('저자는 2자 이상 입력해주세요.');
            return;
        }

        // 검사 3: ISBN 형식 (숫자 13자리)
        if (!/^\d{13}$/.test(isbn)) {
            alert('ISBN은 숫자 13자리로 입력해주세요.');
            return;
        }

        // 검사 4: 숫자 범위 (출판년도 1900~2026)
        if (year === '' || Number(year) < 1900 || Number(year) > 2026) {
            alert('출판년도는 1900~2026 사이로 입력해주세요.');
            return;
        }

        // 검사 5: Select 선택 여부 (카테고리)
        if (category === '') {
            alert('카테고리를 선택해주세요.');
            return;
        }

        // 모든 검사 통과 후 수정 확인
        if (confirm('도서를 수정할까요?')) {
            alert('도서가 수정되었습니다.');
            location.href = 'view.html';
        }
    });
</script>
</body>
</html>
