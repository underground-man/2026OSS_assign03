<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f5f6f8;
        }

        .table-responsive {
            margin-top: 1rem;
        }

        #memberTable tbody tr td {
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">회원 관리 시스템</a>
        </div>
    </nav>

    <div class="container">

        <!-- ===== Create: 회원 등록 폼 ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">회원 등록</h5>
                <form>
                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" class="form-control" id="name" placeholder="홍길동">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="phone" class="form-label">전화번호</label>
                            <input type="text" class="form-control" id="phone" placeholder="010-1234-5678">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">등록</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== Read: 회원 목록 테이블 (예시 데이터) ===== -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover bg-white" id="memberTable">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>전화번호</th>
                        <th style="width: 160px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>홍길동</td>
                        <td>hong@example.com</td>
                        <td>010-1234-5678</td>
                        <td>
                            <!-- Update: 수정 버튼 -->
                            <button class="btn btn-sm btn-outline-primary me-1">수정</button>
                            <!-- Delete: 삭제 버튼 -->
                            <button class="btn btn-sm btn-outline-danger">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>김철수</td>
                        <td>kim@example.com</td>
                        <td>010-2345-6789</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1">수정</button>
                            <button class="btn btn-sm btn-outline-danger">삭제</button>
                        </td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>이영희</td>
                        <td>lee@example.com</td>
                        <td>010-3456-7890</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1">수정</button>
                            <button class="btn btn-sm btn-outline-danger">삭제</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-atwg2Pkwv9vp0ygtn1JAojH0nYbwNJLPhwyoVbhoPwBhjQPR5VtM2+xf0Uwh9KtT" crossorigin="anonymous"></script>

</body>

</html>
